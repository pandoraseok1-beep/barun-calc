(function(){
  var D = window.RATE_DATA, C = window.RateCalc, won = C.won;
  var $ = function(id){ return document.getElementById(id); };
  var S = { carrier:'KT', type:'tv', tvCount:1, speed:null, plan:null, bundle:'phone', usimLines:[], offhour:false, installOption:0 };
  var SPEED_ORDER=['100M','160M','200M','500M','1G'];
  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

  $('basis').textContent = '요금 기준일 ' + D.basisDate;

  function chips(el, items, cur, onPick){
    el.innerHTML='';
    items.forEach(function(it){
      var b=document.createElement('button'); b.type='button'; b.className='chip';
      b.textContent=it.label; b.setAttribute('aria-pressed', String(it.value===cur));
      if(it.disabled){ b.disabled=true; b.title=it.disabled; }
      b.onclick=function(){ onPick(it.value); };
      el.appendChild(b);
    });
  }
  function carrier(){ return C.findCarrier(D,S.carrier); }
  function plans(){ return C.plansFor(D,S.carrier,S.type,S.tvCount); }
  function speeds(){ var s={}; plans().forEach(function(p){s[p.speed]=1;}); return SPEED_ORDER.filter(function(x){return s[x];}).concat(Object.keys(s).filter(function(x){return SPEED_ORDER.indexOf(x)<0;})); }
  var SHOP_SIGN='대표 고객센터 : 031-8028-3085\n바른통신 김대현과장 010-8886-6447 , 이호석과장 010-7397-0904';
  var HOME_LABEL={internet:'인터넷',tv:'인터넷+TV',tvonly:'TV'};
  function extraFor(c,p){ var ex=c.mobileCombine&&c.mobileCombine.internetOnlyExtra; return (ex&&S.type==='internet'&&ex.speeds.indexOf(p.speed)>=0)?ex.amount:0; }
  function baseInstall(c,p){ if(p&&typeof p.install==='number') return p.install; var ci=c.install; return S.type==='internet'?ci.installFeeInternet:(S.tvCount>=2?ci.installFeeTv2:ci.installFeeTv1); }
  function hasUsim(){ return C.usimPlansFor(D,S.carrier).length>0; }

  function normalize(){
    var c=carrier();
    if(S.type==='internet' && !c.internet.length) S.type='tv';
    if(S.type==='tvonly' && !(c.tvOnly&&c.tvOnly.length)) S.type='tv';
    var sp=speeds(); if(sp.indexOf(S.speed)<0) S.speed=sp.indexOf('500M')>=0?'500M':sp[0];
    var list=plans().filter(function(p){return p.speed===S.speed;});
    if(!list.some(function(p){return p.code===S.plan;})) S.plan=list.length?list[0].code:null;
    var p=list.filter(function(x){return x.code===S.plan;})[0];
    if(S.bundle!=='none' && !(p && p.bundleFee)) S.bundle='none';
    if(S.bundle==='usim' && !hasUsim()) S.bundle='phone';
    if(S.bundle==='usim'){
      var codes=C.usimPlansFor(D,S.carrier).map(function(u){return u.code;});
      S.usimLines=S.usimLines.map(function(x){return codes.indexOf(x)>=0?x:'';});
      if(!S.usimLines.length) S.usimLines=[''];
    }
  }

  function render(){
    normalize();
    var c=carrier();
    chips($('carriers'), D.carriers.map(function(x){return {label:x.label,value:x.key};}), S.carrier, function(v){S.carrier=v;S.usimLines=[];render();});
    chips($('types'), [
      {label:'인터넷 단독',value:'internet',disabled:c.internet.length?null:'이 통신사는 인터넷 단독 요금 정보가 없습니다'},
      {label:'인터넷+TV',value:'tv'},
      {label:'TV 단독',value:'tvonly',disabled:(c.tvOnly&&c.tvOnly.length)?null:'이 통신사는 TV 단독 요금 정보가 없습니다'}], S.type, function(v){S.type=v;render();});
    $('tvcount-step').hidden = S.type!=='tv';
    chips($('tvcounts'), [1,2,3].map(function(n){return {label:n+'대',value:n};}), S.tvCount, function(v){S.tvCount=v;render();});
    $('speed-step').hidden = S.type==='tvonly';
    chips($('speeds'), speeds().map(function(s){return {label:s,value:s};}), S.speed, function(v){S.speed=v;render();});

    var pl=$('plans'); pl.innerHTML='';
    plans().filter(function(p){return p.speed===S.speed;}).forEach(function(p){
      var b=document.createElement('button'); b.type='button'; b.className='plan'+(p.blocked?' blocked':'');
      b.setAttribute('aria-pressed',String(p.code===S.plan));
      var gift=p.gift+p.secret+p.extraSetTop;
      b.innerHTML='<span class="nm"></span><span class="pr"></span><span class="sub"></span><span class="gf"></span>';
      b.children[0].textContent=p.name;
      if(p.blocked) b.children[0].insertAdjacentHTML('beforeend','<span class="tag bad">확인 필요·견적 불가</span>');
      else if(p.check) b.children[0].insertAdjacentHTML('beforeend','<span class="tag warn">확인 필요</span>');
      b.children[1].textContent=won(p.fee+(p.rental||0));
      b.children[2].textContent=(p.rental?'셋톱 임대료 '+won(p.rental)+' 포함 · ':'')+(p.bundleFee?'휴대폰 결합 시 '+won(p.bundleFee-extraFor(c,p)+(p.rental||0)):'결합할인 없음');
      b.children[3].textContent=p.gift===null?'사은품 공란':'사은품 '+won(gift);
      b.onclick=function(){S.plan=p.code;render();};
      pl.appendChild(b);
    });

    var p=plans().filter(function(x){return x.code===S.plan;})[0];
    var canBundle=!!(p&&p.bundleFee);
    chips($('bundles'), [
      {label:'결합 안 함',value:'none'},
      {label:'기존 휴대폰 결합',value:'phone',disabled:canBundle?null:'결합할인 정보 없음'},
      {label:'유심 이동 결합',value:'usim',disabled:(canBundle&&hasUsim())?null:'유심 요금제 정보 없음'}
    ], S.bundle, function(v){S.bundle=v;render();});
    $('bundle-note').textContent = !canBundle ? c.label+' 이 상품은 휴대폰 결합할인 정보가 없습니다.'
      : S.bundle==='phone' ? '고객이 이미 '+c.label+' 휴대폰을 쓰는 경우. 결합할인만 적용됩니다.'
      : S.bundle==='usim' ? c.label+' 유심으로 번호이동하면서 결합. 유심 지원금이 추가됩니다.' : '';

    $('usim-step').hidden = S.bundle!=='usim';
    var ul=$('usim-lines'); ul.innerHTML='';
    if(S.bundle==='usim'){
      var ups=C.usimPlansFor(D,S.carrier);
      S.usimLines.forEach(function(code,i){
        var row=document.createElement('div'); row.className='line';
        var sel=document.createElement('select'); sel.id='usim-'+i;
        sel.innerHTML='<option value="">'+(i+1)+'번 회선 요금제 선택</option>'+ups.map(function(u){
          return '<option value="'+u.code+'">'+u.name+' ('+u.data+') '+won(u.fee)+'</option>';}).join('');
        sel.value=code; sel.onchange=function(){S.usimLines[i]=sel.value;render();};
        row.appendChild(sel);
        if(S.usimLines.length>1){ var x=document.createElement('button'); x.className='btn small'; x.textContent='삭제';
          x.onclick=function(){S.usimLines.splice(i,1);render();}; row.appendChild(x); }
        ul.appendChild(row);
      });
    }
    var ci=c.install, base=baseInstall(c,p);
    if(p&&p.installOptions){
      if(!p.installOptions[S.installOption]) S.installOption=0;
      S.offhour=false; $('offhour-step').hidden=false; $('offhour-label').textContent='설치 방식';
      chips($('offhours'), p.installOptions.map(function(o,i){return {label:o.label+' '+won(o.fee),value:i};}), S.installOption, function(v){S.installOption=v;render();});
    } else {
    $('offhour-label').textContent='설치 시간';
    if(base===0) S.offhour=false;
    $('offhour-step').hidden = base===0;
    chips($('offhours'), [
      {label:'평일 주간 '+won(base),value:false},
      {label:'야간·주말 '+won(Math.round(base*ci.offhourRate)),value:true}], S.offhour, function(v){S.offhour=v;render();});
    }

    renderResult();
  }

  function row(t,label,val,cls){ var tr=t.insertRow(); if(cls) tr.className=cls;
    var a=tr.insertCell(), b=tr.insertCell(); a.textContent=label; b.textContent=val; b.className='v'; if(cls==='sec'){ a.colSpan=2; tr.deleteCell(1);} }

  var lastMsg='', lastSummary='';
  function renderResult(){
    var q=C.quote(D,{carrier:S.carrier,type:S.type,tvCount:S.tvCount,plan:S.plan,bundle:S.bundle,
      usimLines:S.usimLines.filter(function(x){return x!==undefined;}),offhour:S.offhour,installOption:S.installOption});
    var al=$('r-alerts'); al.innerHTML='';
    (q.errors||[]).forEach(function(e){ var d=document.createElement('div'); d.className='alert bad'; d.textContent=e; al.appendChild(d); });
    (q.warnings||[]).forEach(function(e){ var d=document.createElement('div'); d.className='alert warn'; d.textContent=e+' — 발송 전 요금을 확인하세요.'; al.appendChild(d); });
    var t=$('r-table'); t.innerHTML='';
    if(q.errors&&q.errors.length){ $('msg').value=''; lastMsg=''; lastSummary=''; $('bar-m').textContent='-'; $('bar-g').textContent='-'; $('r-title').textContent='견적'; return; }
    $('r-title').textContent=q.carrier.label+' '+HOME_LABEL[q.type]+(q.tvCount>1?' '+q.tvCount+'대':'')+(q.usimLines.length?'+유심':'');
    row(t,'월 요금','','sec');
    row(t,HOME_LABEL[q.type]+' '+(q.homeBundleDiscount?'정상가':'월 요금'),won(q.homeFee));
    if(q.rental) row(t,'셋톱박스 임대료',won(q.rental));
    if(q.homeBundleDiscount) row(t,'휴대폰 결합할인','-'+won(q.homeBundleDiscount),'minus');
    q.usimLines.forEach(function(l,i){
      row(t,'유심'+(q.usimLines.length>1?' '+(i+1):'')+' '+l.name,won(l.fee));
      row(t,'선택약정 25%','-'+won(l.discount),'minus');
      if(l.premiumDiscount) row(t,q.premiumSingle.name+' 25%','-'+won(l.premiumDiscount),'minus');
      if(l.combineDiscount) row(t,q.combine.name,'-'+won(l.combineDiscount),'minus');
    });
    if(q.combine&&q.combine.household) row(t,q.combine.name+' 휴대폰 할인 (합계 '+won(q.combine.mobileTotal)+')','-'+won(q.combine.household),'minus');
    if(q.combine||q.premiumSingle) row(t,'적용 결합: '+(q.premiumSingle?q.premiumSingle.name:q.combine.name),'');
    row(t,'월 합계',won(q.monthlyTotal),'sum');
    row(t,'1회 비용','','sec');
    row(t,'설치비'+(q.installLabel?' ('+q.installLabel+')':'')+(q.installOffhour?' (야간·주말 ×'+q.carrier.install.offhourRate+')':''),q.installFinal===0?'무료':won(q.installFinal));
    if(q.giftBlank){ row(t,'사은품','','sec'); row(t,'사은품','공란 (메시지에 표시 안 함)'); }
    else if(q.giftItems.length){
      row(t,'사은품','','sec');
      q.giftItems.forEach(function(g){ row(t,g.label,won(g.amount)); });
      row(t,'사은품 합계',won(q.giftTotal),'giftsum');
    }
    lastMsg=C.buildMessage(q,{customer:$('cust').value.trim(),shop:SHOP_SIGN});
    lastSummary=$('r-title').textContent+' / '+q.plan.name+' / 월 합계 '+won(q.monthlyTotal)+(q.giftBlank?'':' / 사은품 '+won(q.giftTotal));
    $('msg').value=lastMsg;
    $('bar-m').textContent=won(q.monthlyTotal); $('bar-g').textContent=q.giftBlank?'공란':won(q.giftTotal);
  }

  function toast(s){ var el=$('toast'); el.textContent=s; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true;},1800); }
  function copy(){
    if(!lastMsg){ toast('견적 오류를 먼저 해결하세요'); return; }
    var ta=$('msg');
    var fallback=function(){ ta.removeAttribute('readonly'); ta.focus(); ta.select(); try{document.execCommand('copy'); toast('복사했습니다');}catch(e){toast('메시지를 길게 눌러 복사하세요');} ta.setAttribute('readonly',''); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(lastMsg).then(function(){toast('복사했습니다');},fallback); else fallback();
  }
  $('copy').onclick=copy; $('bar-copy').onclick=copy;

  // 상담 신청 -> 텔레그램 봇 (토큰·채팅방은 config.js)
  var CFG=window.CONSULT_CONFIG||{};
  var consultForm=$('consult-form');
  function consultErr(m){ var e=$('c-err'); e.textContent=m; e.hidden=false; }
  function setDone(done){
    [].forEach.call(consultForm.querySelectorAll('.fld,.agree,.acts,.policy,.note'),function(e){ e.hidden=done; });
    $('c-quote').hidden=done||!lastSummary;
    var d=consultForm.querySelector('.done'); if(d) d.remove();
  }
  function openConsult(){
    $('c-err').hidden=true; setDone(false);
    $('c-quote').textContent=lastSummary?'함께 전달되는 견적: '+lastSummary:'';
    $('c-submit').disabled=false; $('c-submit').textContent='상담 신청하기';
    $('consult').hidden=false; setTimeout(function(){ $('c-name').focus(); },50);
  }
  function closeConsult(){ $('consult').hidden=true; $('bar-consult').focus(); }
  function fmtPhone(v){
    var d=v.replace(/\D/g,'').slice(0,11);
    if(d.indexOf('02')===0) return d.length>9?d.replace(/^(02)(\d{4})(\d{4})$/,'$1-$2-$3'):d.replace(/^(02)(\d{0,3})(\d{0,4})$/,'$1-$2-$3').replace(/-+$/,'');
    return d.length>10?d.replace(/^(\d{3})(\d{4})(\d{4})$/,'$1-$2-$3'):d.replace(/^(\d{3})(\d{0,3})(\d{0,4})$/,'$1-$2-$3').replace(/-+$/,'');
  }
  $('c-phone').addEventListener('input',function(){ this.value=fmtPhone(this.value); });
  $('bar-consult').onclick=openConsult; $('c-cancel').onclick=closeConsult;
  $('consult').addEventListener('click',function(e){ if(e.target===this) closeConsult(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('consult').hidden) closeConsult(); });
  consultForm.addEventListener('submit',function(e){
    e.preventDefault(); $('c-err').hidden=true;
    var v={name:$('c-name').value.trim(),phone:$('c-phone').value.replace(/\D/g,''),region:$('c-region').value.trim(),
      mobile:$('c-mobile').value,isp:$('c-isp').value,contract:$('c-contract').value};
    if(!v.name) return consultErr('고객 성함을 입력하세요.');
    if(!/^0\d{8,10}$/.test(v.phone)) return consultErr('연락처를 정확히 입력하세요. (예: 010-1234-5678)');
    if(!v.region) return consultErr('지역을 입력하세요.');
    if(!v.mobile) return consultErr('기존 모바일 통신사를 선택하세요.');
    if(!v.isp) return consultErr('현재 인터넷 통신사를 선택하세요.');
    if(!v.contract) return consultErr('인터넷 약정 만료 여부를 선택하세요.');
    if(!$('c-agree').checked) return consultErr('개인정보 수집·이용에 동의해야 신청할 수 있습니다.');
    if(!CFG.token||!CFG.chatId) return consultErr('상담 접수 설정이 아직 안 되어 있습니다. 카톡 또는 031-8028-3085로 문의해 주세요.');
    var now=new Date(), pad=function(n){ return (n<10?'0':'')+n; };
    var text=['[바른통신 상담 신청]','고객 성함: '+v.name,'연락처: '+fmtPhone(v.phone),'지역: '+v.region,
      '기존 모바일: '+v.mobile,'인터넷 통신사: '+v.isp,'약정 만료 여부: '+v.contract,'',
      '보고 있던 견적: '+(lastSummary||'없음'),
      '접수 시각: '+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())].join('\n');
    var btn=$('c-submit'); btn.disabled=true; btn.textContent='보내는 중…';
    var body=new URLSearchParams(); body.append('chat_id',CFG.chatId); body.append('text',text);
    fetch('https://api.telegram.org/bot'+CFG.token+'/sendMessage',{method:'POST',body:body})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j||!j.ok) throw new Error('send failed');
        setDone(true);
        var d=document.createElement('div'); d.className='done';
        d.innerHTML='<b>상담 신청이 접수되었습니다</b><span class="note">곧 연락드리겠습니다. 급하시면 031-8028-3085로 전화 주세요.</span>';
        var ok=document.createElement('button'); ok.type='button'; ok.className='btn primary'; ok.textContent='확인';
        ok.onclick=function(){ consultForm.reset(); closeConsult(); };
        d.appendChild(ok); consultForm.appendChild(d); ok.focus();
      })
      .catch(function(){
        btn.disabled=false; btn.textContent='상담 신청하기';
        consultErr('접수에 실패했습니다. 잠시 후 다시 시도하시거나 카톡 또는 031-8028-3085로 문의해 주세요.');
      });
  });
  $('add-line').onclick=function(){ S.usimLines.push(''); render(); };
  $('cust').oninput=renderResult;

  function tab(which){
    $('tab-calc').setAttribute('aria-pressed',String(which==='calc')); $('tab-rates').setAttribute('aria-pressed',String(which==='rates'));
    $('view-calc').hidden=which!=='calc'; $('view-rates').hidden=which!=='rates'; $('bar').hidden=which!=='calc';
  }
  $('tab-calc').onclick=function(){tab('calc');}; $('tab-rates').onclick=function(){tab('rates');};

  // 요금표 전체 보기 (검수용)
  (function(){
    $('rates-note').textContent='출처: '+D.source+' · 기준일 '+D.basisDate+' · 금액은 부가세 포함 월요금(3년 약정). 사은품 = 지원금 + 추가지원금 + 추가셋톱.';
    var h='';
    function tbl(title,list){
      h+='<h3>'+title+'</h3><table><tr><th>속도</th><th>상품명</th><th>정상가</th><th>결합가</th><th>결합할인</th><th>사은품</th></tr>';
      list.forEach(function(p){
        var flag=p.blocked?' <span class="tag bad">견적 불가</span>':p.check?' <span class="tag warn">확인 필요</span>':'';
        h+='<tr><td>'+p.speed+'</td><td>'+p.name+(p.rental?' (+셋톱 임대료 '+won(p.rental)+')':'')+flag+'</td><td>'+won(p.fee)+'</td><td>'+(p.bundleFee?won(p.bundleFee):'-')+'</td><td>'+(p.bundleFee?won(p.fee-p.bundleFee):'-')+'</td><td>'+(p.gift===null?'공란':won(p.gift+p.secret+p.extraSetTop))+'</td></tr>';
      });
      h+='</table>';
    }
    D.carriers.forEach(function(c){
      if(c.internet.length) tbl(c.label+' · 인터넷 단독',c.internet);
      ['1','2','3'].forEach(function(n){ if(c.tv[n].length) tbl(c.label+' · 인터넷+TV '+n+'대',c.tv[n]); });
      if(c.tvOnly&&c.tvOnly.length) tbl(c.label+' · TV 단독 (설치비 '+c.tvOnly[0].installOptions.map(function(o){return o.label+' '+won(o.fee);}).join(' / ')+')',c.tvOnly);
      if(c.mobileCombine){ var m=c.mobileCombine, f=function(ts){return ts.map(function(x){return won(x[0])+'↑ -'+won(x[1]);}).join(', ');};
        if(m.internetOnlyExtra) h+='<p class="note">인터넷 단독 '+m.internetOnlyExtra.speeds.join('/')+' + 휴대폰 결합(정액·총액) 시 인터넷 '+won(m.internetOnlyExtra.amount)+' 추가 할인 (위 표의 결합가에서 추가로 차감, 프리미엄 싱글결합 시 제외)</p>';
        h+='<p class="note">휴대폰 결합: 월정액 합계 '+won(m.threshold)+' 미만 → '+m.jeongaek.name+' (회선별 '+f(m.jeongaek.tiers)+') / 이상 → '+m.chongaek.name+' (가구 합계, 500M·1G: '+f(m.chongaek.standard)+' · 100M: '+f(m.chongaek.slim)+')</p>'; }
      if(c.premiumSingle) h+='<p class="note">'+c.premiumSingle.name+': 인터넷 '+c.premiumSingle.speeds.join('/')+' + 월정액 '+won(c.premiumSingle.minFee)+' 이상 휴대폰 1회선 결합 시 휴대폰 월정액 '+(c.premiumSingle.rate*100)+'% 추가 할인 (선택약정과 중복)</p>';
      h+='<p class="note">설치비: 인터넷 '+won(c.install.installFeeInternet)+' · TV 1대 '+won(c.install.installFeeTv1)+' · TV 2대 이상 '+won(c.install.installFeeTv2)+' · 야간·주말 ×'+c.install.offhourRate+'</p>';
    });
    h+='<h3>유심 요금제 (선택약정 25% 적용가)</h3><table><tr><th>통신사</th><th>요금제</th><th>정상가</th><th>약정가</th><th>지원금(100M)</th><th>지원금(500M↑)</th></tr>';
    D.usim.forEach(function(u){ h+='<tr><td>'+u.carrier+'</td><td>'+u.name+' ('+u.data+')</td><td>'+won(u.fee)+'</td><td>'+won(Math.round(u.fee*0.75))+'</td><td>'+won(u.gift100)+'</td><td>'+won(u.gift500)+'</td></tr>'; });
    h+='</table>';
    $('rates').innerHTML=h;
  })();

  render();
})();
</script>
